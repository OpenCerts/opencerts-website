sonar.projectKey=OpenCerts_opencerts-website
sonar.organization=opencerts

sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.js,src/**/*.spec.jsx,src/**/__tests__/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/.coverage/**,src/**/fixture/**
sonar.coverage.exclusions=src/**/*.spec.js,src/**/*.test.*,src/**/__tests__/**

sonar.javascript.lcov.reportPaths=.coverage/lcov.info
sonar.testExecutionReportPaths=.coverage/sonar-report.xml
