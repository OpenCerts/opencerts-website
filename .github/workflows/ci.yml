name: CI - Lint and Test

on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check --if-present

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --coverage --coverageReporters=lcov

      - name: Upload coverage for Sonar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            .coverage/lcov.info
            .coverage/sonar-report.xml
          include-hidden-files: true # .coverage is a dot-directory
          retention-days: 1
          if-no-files-found: warn

      - name: Build and run integration
        env:
          # Public default Infura keys used for CI.
          INFURA_API_KEY_PROVIDER: "84842078b09946638c03157f83405213"
          INFURA_API_KEY_RESOLVER: "84842078b09946638c03157f83405213"
        run: ./scripts/integration-headless.sh

  sonar:
    name: SonarCloud Scan
    needs: lint-and-test
    if: ${{ !cancelled() }} # still report to Sonar when a test fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, needed for Sonar's new-code analysis

      - name: Download coverage
        uses: actions/download-artifact@v8
        continue-on-error: true # scan without coverage rather than not at all
        with:
          name: coverage
          path: .coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
